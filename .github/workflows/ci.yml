name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # Frontend Linting, Type-Check, and Automated Tests
  # -------------------------------------------------------------
  test-frontend:
    name: Lint, Test, & Build Web Client
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit & Component Tests
        run: npm test

      - name: Verify Production Build
        run: npm run build