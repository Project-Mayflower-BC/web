name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Frontend Linting, Type-Check, and Automated Tests
  # -------------------------------------------------------------
  test-frontend:
    name: Lint, Test, & Build Web Client
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json' # Adjust if package-lock is at repo root

      - name: Install dependencies
        working-directory: ./web # Adjust path if web is at the repo root
        run: npm ci

      - name: Run ESLint
        working-directory: ./web
        run: npm run lint

      - name: Run Unit & Component Tests
        working-directory: ./web
        run: npm test

      - name: Verify Production Build
        working-directory: ./web
        run: npm run build